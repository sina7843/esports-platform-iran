name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGO_URL: mongodb://localhost:27017/esports_test?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: init replica set
        run: docker exec $(docker ps -q --filter ancestor=mongo:8.0) mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})' || true
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: docker build -f apps/api/Dockerfile -t esp-api:ci .
      - run: docker build -f apps/worker/Dockerfile -t esp-worker:ci .
      - run: docker build -f apps/web/Dockerfile -t esp-web:ci .
